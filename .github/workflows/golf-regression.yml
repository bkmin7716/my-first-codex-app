name: Golf regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golf-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-and-logic:
    name: Legacy preservation and shared-game database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run all unit, migration, RPC and legacy contract tests
        run: npm test

  mobile-browser:
    name: Four-player mobile browser journey (isolated test database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run mobile shared-game browser tests
        run: npm run test:browser
